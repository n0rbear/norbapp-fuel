name: City DB check (temporary)
on:
  push:
    branches: [notify-city]
    paths: [".github/workflows/city-db-check.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Report
        run: |
          {
            for p in @ip-location-db/dbip-city-mmdb @ip-location-db/geolite2-city-mmdb @ip-location-db/dbip-city-ipv4 ; do
              echo "== $p"; npm view $p version dist.unpackedSize license 2>&1 | head -5
            done
            mkdir t && cd t && npm init -y >/dev/null && npm install @ip-location-db/dbip-city-mmdb mmdb-lib --no-audit --no-fund >/dev/null 2>&1
            ls -la node_modules/@ip-location-db/dbip-city-mmdb
            node -e '
              const fs=require("fs"); const {Reader}=require("mmdb-lib");
              const d="node_modules/@ip-location-db/dbip-city-mmdb/";
              for (const f of fs.readdirSync(d).filter(f=>f.endsWith(".mmdb"))) {
                const m0=process.memoryUsage().rss; const r=new Reader(fs.readFileSync(d+f));
                console.log(f, "rssMB+", Math.round((process.memoryUsage().rss-m0)/1e6), JSON.stringify([r.get("84.2.44.1"), r.get("2a02:ab88::1"), r.get("188.6.0.1")]));
              }'
          } > ../city-db-report.txt 2>&1 || true
          cat ../city-db-report.txt
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add city-db-report.txt && git commit -m "city db report [skip ci]" && git push
