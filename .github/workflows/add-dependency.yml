name: Add dependency (temporary)
on:
  push:
    branches: [notify-country]
    paths: [".github/workflows/add-dependency.yml"]
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm uninstall geoip-country --no-audit --no-fund && npm install @ip-location-db/dbip-country-mmdb mmdb-lib --save --no-audit --no-fund
      - name: Inspect the packages
        run: |
          {
            cat node_modules/@ip-location-db/dbip-country-mmdb/package.json
            ls -la node_modules/@ip-location-db/dbip-country-mmdb
            ls node_modules/mmdb-lib/lib/*.d.ts | head
            node -e '
              const fs=require("fs"); const {Reader}=require("mmdb-lib");
              const dir="node_modules/@ip-location-db/dbip-country-mmdb/";
              for (const f of fs.readdirSync(dir).filter(f=>f.endsWith(".mmdb"))) {
                const r=new Reader(fs.readFileSync(dir+f));
                console.log(f, JSON.stringify([r.get("84.2.44.1"), r.get("2a02:ab88::1"), r.get("8.8.8.8")]));
              }'
          } > ../dependency-report.txt 2>&1 || true
          cat ../dependency-report.txt
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add package.json package-lock.json ../dependency-report.txt
          git commit -m "web: add dbip-country-mmdb and mmdb-lib [skip ci]"
          git push
