name: Build report (temporary)
on:
  push:
    branches: [notify-country]
permissions:
  contents: read
  pull-requests: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Build and report
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          { echo "build exit=$code"; echo '```'; grep -v "^\s*$" build.log | tail -60; echo '```'; } > report.md
          gh pr comment 27 --repo ${{ github.repository }} --body-file report.md
          exit $code
