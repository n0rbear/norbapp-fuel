services:
  - type: web
    name: norbapp-fuel-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: TANKERKOENIG_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: REFRESH_TIME
        value: "06:00"
      - key: REFRESH_TZ
        value: Europe/Budapest
      - key: LOG_LEVEL
        value: INFO
