# Render Blueprint for Fuel by NorbApp. Both services deploy from `main`.
# Free plan. The web service also runs the FUEL-API, so only it has to stay
# awake: the Keto Mentor API requests its health check every 10 minutes
# (KEEP_AWAKE_URLS on keto-mentor-api). The separate API service below is
# kept as a fallback and can be removed.
services:
  # FUEL-API: fuel prices, tolls and currencies (backend/, FastAPI)
  - type: web
    name: norbapp-fuel-api-fra
    runtime: python
    rootDir: backend
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: TANKERKOENIG_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: REFRESH_TIME
        value: "06:00"
      - key: REFRESH_TZ
        value: Europe/Budapest
      - key: LOG_LEVEL
        value: INFO

  # Web app: fuel.norbapp.com (web/, Next.js)
  - type: web
    name: norbapp-fuel-web
    runtime: node
    rootDir: web
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    domains:
      - fuel.norbapp.com
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # The FUEL-API runs inside this service (web/scripts/setup-api.mjs and
      # web/scripts/start.mjs); FUEL_API_URL is only the fallback without Python.
      - key: FUEL_API_URL
        value: https://norbapp-fuel-api-fra.onrender.com
      - key: TANKERKOENIG_API_KEY
        sync: false
      # Community price reports: the shared NorbApp Postgres (schema "fuel").
      - key: FUEL_DATABASE_URL
        sync: false
      - key: FUEL_HASH_SECRET
        generateValue: true
      # Login for the /stat usage statistics page (Basic Auth).
      - key: STATS_USER
        sync: false
      - key: STATS_PASSWORD
        sync: false
      - key: REFRESH_TIME
        value: "06:00"
      - key: REFRESH_TZ
        value: Europe/Budapest
